# Revara fork: builds the Revit 2025, 2026 and 2027 add-ins and tests the message framer on every push to the
# revara, revara-installer and scratch/fork-r27-* branches and on every pull request to revara. GitHub-hosted
# runners only. The upstream release workflow (npm publish on v* tags) is removed in this branch, and this fork
# never pushes v* tags. What each year's add-in must contain is defined in scripts/ci-check.ps1, not here.
name: revara-ci

on:
  push:
    branches: [revara, revara-installer, 'scratch/fork-r27-*']
  pull_request:
    branches: [main, revara]

permissions:
  contents: read

jobs:
  framer-tests:
    name: MessageFramer tests (no Revit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: dotnet test
        working-directory: tests/framer
        run: dotnet test

  build:
    name: Build Revit ${{ matrix.year }} add-in (Release R${{ matrix.yy }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: 2025
            yy: 25
          - year: 2026
            yy: 26
          - year: 2027
            yy: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: dotnet --version
        run: dotnet --version
      - name: dotnet build
        run: dotnet build mcp-servers-for-revit.sln -c "Release R${{ matrix.yy }}"
      - name: Check the add-in layout, version and target framework
        shell: pwsh
        run: ./scripts/ci-check.ps1 -Year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-servers-for-revit-revara-Revit${{ matrix.year }}
          path: plugin/bin/AddIn ${{ matrix.year }} Release R${{ matrix.yy }}/
          if-no-files-found: error
